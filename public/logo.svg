<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Specular Highlight Overlay -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- Spark Emerald Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)" filter="url(#cardGlow)" />
  
  <!-- Specular Top Rim -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#specular)" stroke-width="4" />

  <!-- Background Decorative Glass Ring -->
  <circle cx="390" cy="120" r="80" fill="#ffffff" fill-opacity="0.08" />
  <circle cx="120" cy="400" r="100" fill="#000000" fill-opacity="0.08" />

  <!-- Secondary Background Card (Angled Deck Layer) -->
  <rect x="150" y="110" width="240" height="150" rx="24" transform="rotate(-12 270 185)" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" />

  <!-- Primary Foreground Glass Card -->
  <g filter="url(#cardGlow)">
    <rect x="116" y="156" width="280" height="200" rx="32" fill="url(#glassCard)" stroke="#ffffff" stroke-width="3" />
    
    <!-- Chip / Contactless Indicator -->
    <rect x="152" y="196" width="44" height="34" rx="8" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M166 196 v34 M178 196 v34 M152 213 h44" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Sleek Minimalist Expensi "E" & Pulse Graph inside Card -->
    <path d="M 230 250 L 260 215 L 290 240 L 340 185" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Spark Glowing Upward Node -->
    <circle cx="340" cy="185" r="7" fill="url(#sparkGrad)" stroke="#ffffff" stroke-width="2.5" />

    <!-- Embossed Cardholder Bar -->
    <rect x="152" y="300" width="110" height="12" rx="6" fill="#cbd5e1" />
    <rect x="280" y="300" width="40" height="12" rx="6" fill="#94a3b8" />
    
    <!-- Hologram Circle -->
    <circle cx="350" cy="306" r="14" fill="#6366f1" fill-opacity="0.3" />
    <circle cx="366" cy="306" r="14" fill="#a855f7" fill-opacity="0.3" />
  </g>

  <!-- Glowing Corner Sparkle -->
  <path d="M 390 100 Q 390 120 410 120 Q 390 120 390 140 Q 390 120 370 120 Q 390 120 390 100 Z" fill="url(#sparkGrad)" />
</svg>
