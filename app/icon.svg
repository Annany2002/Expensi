<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#iconBg)" />
  <rect x="6" y="6" width="116" height="116" rx="30" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Mini Deck Layer -->
  <rect x="36" y="26" width="62" height="40" rx="8" transform="rotate(-10 67 46)" fill="#ffffff" fill-opacity="0.25" />

  <!-- Front Card -->
  <rect x="26" y="38" width="76" height="54" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Pulse Line -->
  <path d="M 40 68 L 52 56 L 64 64 L 78 48" fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="78" cy="48" r="3" fill="url(#spark)" />

  <!-- Chip -->
  <rect x="36" y="46" width="12" height="10" rx="2" fill="#cbd5e1" />
  <!-- Lower Bar -->
  <rect x="36" y="78" width="30" height="4" rx="2" fill="#cbd5e1" />
</svg>
